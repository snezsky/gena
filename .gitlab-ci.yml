stages:
  - build
  - test

variables:
  PRESET: "clang-debug-dev"
  
build-job:
  stage: build
  script:
    - cmake --preset $PRESET
    - cmake --build out/build/$PRESET
  artifacts:
    paths:
      - out/build/$PRESET

test-job:
  stage: test
  dependencies:
    - build-job
  script:
    - ctest --preset test-$PRESET
